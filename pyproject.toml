[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockfinder"
version = "0.1.0"
description = "A Python application for finding stocks."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "stockfinder contributors" },
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=11.0",
    "plotly>=6.0",
    "streamlit>=1.45",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
stockfinder = "stockfinder.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stockfinder"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
